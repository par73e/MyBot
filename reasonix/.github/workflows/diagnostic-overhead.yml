name: Diagnostic overhead monitoring

on:
  push:
    branches: [main-v2]
    paths:
      - desktop/electron/**
      - desktop/frontend/**
      - desktop/package.json
      - desktop/pnpm-lock.yaml
      - desktop/pnpm-workspace.yaml
      - .github/workflows/diagnostic-overhead.yml
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-overhead-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install the Electron workspace
        run: pnpm install --frozen-lockfile
      - name: Measure Electron diagnostic overhead
        timeout-minutes: 10
        run: node electron/scripts/performance-benchmark.mjs
      - name: Upload diagnostic benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostic-overhead-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/electron/artifacts/performance/overhead.json
            desktop/electron/artifacts/performance/diagnostic-report.png
