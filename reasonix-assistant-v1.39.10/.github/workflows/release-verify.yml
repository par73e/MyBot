name: Verify release
run-name: Verify v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Official version without a tag prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify immutable files and public pointers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_OPERATION: recover
          CLI_TAG: v${{ inputs.version }}
          DESKTOP_TAG: desktop-v${{ inputs.version }}
          VERIFY_PUBLIC_POINTERS: "true"
          CLI_PUBLISH_FROZEN: ${{ vars.CLI_PUBLISH_FROZEN == 'true' }}
        run: bash scripts/verify-stable-release-artifacts.sh
